services:
  - type: web
    name: personal-nemo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: PUBLIC_DEMO
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: DAILY_SPEND_CAP_USD
        value: "1.00"
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVIL_API_KEY
        sync: false

